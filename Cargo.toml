
cargo-features = ["profile-rustflags"]

[package]
name = "tablica"
version = "0.2.16-dev"
edition = "2024"
repository = "github.com/eye-wave/8x20"
license = "GPL-3.0-or-later"

[dependencies]
dirs = "7.0.0"
encoding_rs = "0.8"
fltk = "1.5"
minreq = { version = "3", default-features = false, features = [
  "https-rustls",
], optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }
regex-lite = "0.1.9"
serialport = "4.10"

[features]
default = ["rfd", "tls"]
tls = ["dep:minreq"]
ossl = ["dep:openssl"]

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.18", default-features = false, optional = true }

[build-dependencies]
winresource = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "debuginfo"
debug = false
overflow-checks = false
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one broken target must not hide the others
      matrix:
        include:
          - {
              name: windows-10-64,
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
            }
          - {
              name: windows-7-64,
              os: windows-latest,
              target: x86_64-win7-windows-msvc,
              flags: --no-default-features, # probe: no rfd
            }
          - {
              name: windows-7-32,
              os: windows-latest,
              target: i686-win7-windows-msvc,
              flags: --no-default-features,
            }
          - {
              name: linux-64,
              os: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
            }
          - {
              name: linux-32,
              os: ubuntu-22.04,
              target: i686-unknown-linux-gnu,
              multilib: true,
            }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Linux 64 deps
        if: matrix.os == 'ubuntu-22.04' && !matrix.multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev libudev-dev

      - name: Linux 32 deps
        if: matrix.multilib
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config gcc-multilib g++-multilib libx11-dev:i386 libxext-dev:i386 \
            libxft-dev:i386 libxinerama-dev:i386 libxcursor-dev:i386 libxrender-dev:i386 libxfixes-dev:i386 \
            libpango1.0-dev:i386 libgl1-mesa-dev:i386 libglu1-mesa-dev:i386 libudev-dev:i386
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: NASM + Strawberry Perl for vendored OpenSSL
        if: contains(matrix.target, 'win7')
        shell: bash
        run: |
          choco install nasm -y
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # - name: Test (native targets only)
      #   if: matrix.name == 'windows-10-64' || matrix.name == 'linux-64'
      #   run: cargo test --release

      - name: Build
        run: cargo --config .cargo/size.toml build --release --target ${{ matrix.target }} ${{ matrix.flags }}

      - name: Win7 import check (which DLLs/functions the exe pulls in)
        if: contains(matrix.target, 'win7')
        shell: bash
        continue-on-error: true
        run: |
          pip install -q pefile
          python - "target/${{ matrix.target }}/release/tablica.exe" <<'PY'
          import pefile, sys
          p = pefile.PE(sys.argv[1])
          for attr in ("DIRECTORY_ENTRY_IMPORT", "DIRECTORY_ENTRY_DELAY_IMPORT"):
              for e in getattr(p, attr, []):
                  dll = e.dll.decode().lower()
                  names = [i.name.decode() if i.name else f"#{i.ordinal}" for i in e.imports]
                  print(attr[16:], dll, len(names))
                  if "combase" in dll or dll.startswith("api-ms"):
                      print("   ", ", ".join(names))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: tablica-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/tablica
            target/${{ matrix.target }}/release/tablica.exe
          if-no-files-found: error

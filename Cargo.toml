
cargo-features = ["profile-rustflags"]

[package]
name = "tablica"
version = "0.1.0"
edition = "2024"

[dependencies]
encoding_rs = "0.8"
fltk = "1.5"
serialport = "4.10"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "debuginfo"
debug = false
overflow-checks = false
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]

# Themes, in menu order; the first one is the default. build.rs turns this into Rust (the
# `THEMES` table in theme.rs), so a new theme is a new entry here + its tex/<dir>/bg.png.
# Colours are 0xRRGGBB.
#
#   key      saved in the config file
#   name     shown in the app
#   bg       backdrop, relative to tex/
#   colors   UI colours (see `Colors` in theme.rs)
#   season   optional; DD-MM .. DD-MM inclusive (may wrap over New Year). While "Motywy
#            okolicznościowe" is on, the theme activates itself on those days.
#   recolor  optional; source colour in tex/*.svg -> replacement. The SVGs are drawn once in
#            the default palette and recoloured on load. A theme that recolours anything must
#            list every colour (`cargo test` checks it); build.rs rejects colours not in the SVGs.
#            "white" in the SVGs counts as 0xFFFFFF.

- key: domyslny
  name: Domyślny
  bg: bg.png
  colors:
    label: 0xEED590
    panel: 0xFBF3DC
    accent: 0xEED590
    rule: 0xC8BE96
    scrim: 0x1A2A1E
    page_line: 0x787878
    marks: 0xA0A0A0
    text: 0x7A6C3C
    text_bg: 0xFBF4DD
    page_info: 0x244A30

